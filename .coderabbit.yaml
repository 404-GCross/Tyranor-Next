language: "zh-CN"
early_access: false

reviews:
  # 使用较严格的审核风格。
  profile: "assertive"

  # 当发现需要阻塞合并的问题时，允许 CodeRabbit 使用 Request Changes。
  request_changes_workflow: true

  # 输出 PR 高层摘要，方便快速确认修改范围。
  high_level_summary: true

  # 显示审核状态。
  review_status: true

  # 不需要诗歌之类的非技术输出。
  poem: false

  # 默认展开 walkthrough，便于查看本次修改涉及的模块。
  collapse_walkthrough: false

  auto_review:
    # PR 创建和更新后自动审核。
    enabled: true

    # 草稿 PR 暂时不审核，避免开发过程中产生大量噪声。
    drafts: false

  # ============================================================
  # Tyranor Next 项目审核规则
  #
  # 审核时必须同时以：
  #   1. AGENT.md
  #   2. CONTRIBUTING.md
  # 为项目级审核依据。
  #
  # AGENT.md 中使用“必须 / 禁止 / 统一”等明确措辞的规范，
  # 应视为强制规则，而不是普通建议。
  # ============================================================

  path_instructions:

    # ----------------------------------------------------------
    # 全仓库通用规则
    # ----------------------------------------------------------
    - path: "**/*"
      instructions: |
        本仓库为 Tyranor Next。

        审核所有 Pull Request 时，必须优先阅读并遵守仓库根目录中的：

        - AGENT.md
        - CONTRIBUTING.md

        这两个文件属于项目级审核规范。

        其中：

        - AGENT.md 定义项目技术实现规范、UI 规范、主题规范、
          公共组件规范以及 Agent 测试与审核要求。
        - CONTRIBUTING.md 定义 Pull Request、代码规范、测试、
          引擎修改、Bug 修复以及合并要求。

        AGENT.md 中出现“必须”、“禁止”、“统一”、“只能”等明确要求时，
        不得将违反这些规则的问题仅作为可选优化建议。

        对明确违反 AGENT.md 强制规范的问题，
        默认至少按 Major 级别处理；
        如果该违规可能导致崩溃、数据损坏、严重兼容性问题或核心功能失效，
        应提升为 Blocker。

        审核时至少从以下角度独立检查：

        1. 代码逻辑
           - 条件判断是否正确
           - 状态流转是否合理
           - 是否存在遗漏分支
           - 是否存在错误默认值
           - 是否正确处理边界条件

        2. 架构
           - 是否破坏现有模块职责
           - 是否引入不合理依赖
           - 是否重复实现已有公共能力
           - 是否绕过已有公共组件或公共入口
           - 是否产生不必要的代码耦合

        3. 健壮性
           - null / 空值
           - 空集合
           - 非法参数
           - 文件不存在或损坏
           - 权限失效
           - 网络失败
           - 生命周期异常
           - 资源未释放
           - 重复操作
           - 并发 / 竞态条件
           - 极端输入

        4. 回归风险
           - 修改是否破坏已有功能
           - 是否影响未直接修改的调用方
           - 是否影响其它游戏引擎
           - 是否改变公共行为
           - 是否改变持久化格式、路径、默认值或生命周期

        5. 代码规范
           - 是否符合 AGENT.md
           - 命名是否清晰
           - 是否存在重复代码
           - 是否存在无用代码
           - 是否遗留调试代码
           - 是否出现与当前 PR 无关的大范围修改
           - 是否提交敏感信息

        审核输出应优先报告真实问题，
        避免纯风格偏好和没有实际收益的建议。

        严重程度统一理解为：

        Blocker:
        - 崩溃
        - 数据损坏
        - 严重安全问题
        - 核心功能失效
        - 核心引擎无法运行
        - 确定性的严重回归

        Major:
        - 明确违反 AGENT.md 强制规范
        - 明显逻辑错误
        - 生命周期问题
        - 文件 / 权限处理错误
        - 明显兼容性问题
        - 高概率功能回归
        - 公共架构被错误绕过

        Minor:
        - 局部代码质量问题
        - 可维护性问题
        - 非关键规范偏差

        Suggestion:
        - 不影响当前正确性的可选优化

        Blocker 和 Major 应视为阻塞合并的问题。

        不得因为代码能够编译就认为实现正确。
        不得把静态代码审核描述为已完成真实 Android 实机测试。

    # ----------------------------------------------------------
    # Kotlin / Java 应用代码
    # ----------------------------------------------------------
    - path: "app/src/main/**/*.kt"
      instructions: |
        严格按照 AGENT.md 审核 Android、Kotlin、Jetpack Compose 代码。

        重点检查：

        - Compose 状态是否正确
        - remember / mutableStateOf 使用是否合理
        - 是否存在错误重组或状态不同步
        - Coroutine 是否绑定正确生命周期
        - Activity / Context 是否存在泄漏风险
        - 异步任务结束后是否可能操作失效页面
        - 是否存在重复请求、重复点击或竞态
        - 文件 IO 是否处理异常
        - SAF URI 权限是否可能已经失效
        - SharedPreferences 数据读取是否安全
        - 公共逻辑是否被重复实现
        - 修改是否影响其它页面调用方

        如果修改涉及现有公共组件，
        必须检查所有主要调用点是否可能产生回归。

    - path: "app/src/main/**/*.java"
      instructions: |
        重点审核 Java 与 Kotlin 之间的桥接兼容性。

        检查：

        - nullability
        - Java/Kotlin 类型转换
        - Context 生命周期
        - JNI 调用
        - 异常是否被错误吞掉
        - 资源是否正确释放
        - 修改是否破坏已有 Kotlin 调用方

    # ----------------------------------------------------------
    # UI / Compose
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/ui/**/*.kt"
      instructions: |
        本路径必须严格执行 AGENT.md 中全部 UI 统一规范。

        特别检查：

        顶部栏：
        - 页面顶部栏是否遵守 AGENT.md 的统一结构。
        - 不应使用 Material3 TopAppBar 代替项目规定的结构。
        - 不应擅自在顶部栏增加返回按钮。
        - 标题区应遵守统一高度、padding、字体和粗细规范。
        - 状态栏应遵守透明沉浸式和 statusBarsPadding 规则。

        顶部栏按钮：
        - 必须优先使用项目公共 TopBarIcon。
        - 禁止自行使用 IconButton / Icon 拼装顶部栏按钮。
        - 顶部栏图标应使用 drawable 资源。
        - 不应直接使用 Icons.* 替代项目规定的 drawable。

        圆角：
        - 列表项、功能卡片、弹窗等项目规定组件应使用统一 8dp 圆角。
        - 对非 8dp 的新增实现应检查是否明确违反 AGENT.md。

        Typography：
        - 页面正文应遵守 AGENT.md 限定的 typography。
        - 检查 bodySmall、bodyLarge、labelMedium、labelLarge、
          headlineMedium、headlineSmall 等被禁止的样式。
        - 顶部栏 titleLarge 例外。

        输入框：
        - 搜索框与项目规定的单行输入框应使用 AppSearchField。
        - 检查新增 TextField、OutlinedTextField、
          Miuix SearchBar/InputField 是否绕过公共组件。

        页面一致性：
        - 新页面是否复用已有公共结构。
        - 是否出现重复实现已有组件。
        - 是否破坏页面切换动画规范。

    # ----------------------------------------------------------
    # 主题 / 色调
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/theme/**/*.kt"
      instructions: |
        主题系统属于高风险公共代码。

        严格检查 AGENT.md 中定义的主题状态传播规则。

        特别检查：

        - AppThemeColors.primary 是否仍为唯一主题色状态来源。
        - 是否出现第二套独立 primary 状态。
        - TyranorNextTheme 与 MiuixSettingsTheme 是否正确读取全局状态。
        - 是否错误移除 @NonSkippableComposable。
        - 是否修改 ensureLoaded / refresh 行为导致主题不刷新。
        - 是否可能导致部分页面切换主题后不重组。
        - 是否改变 PageGrey / NavWhite / TextColor 的语义。
        - 是否影响色调切换和深浅模式。

        任何可能造成主题只在部分页面生效的问题，
        至少按 Major 处理。

    - path: "app/src/main/java/**/*.kt"
      instructions: |
        同时检查主题与颜色使用规范。

        重点发现：

        - 页面内新增 Color(0x...)
        - 页面内新增固定品牌蓝
        - 新增 #307DEF 等硬编码主题色
        - 新增 Blue40 等固定主题色引用
        - 应使用 MaterialTheme.colorScheme.primary 却硬编码颜色
        - 应使用 MiuixTheme.colorScheme.primary 却硬编码颜色
        - 应使用 NavWhite / PageGrey / TextColor
          却错误依赖 surfaceContainer / surfaceVariant 等 scheme 容器色

        不要机械报告所有 Color 使用；
        语义色、引擎封面色和 AGENT.md 明确允许的场景除外。

    # ----------------------------------------------------------
    # 公共 UI 组件
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/ui/common/**/*.kt"
      instructions: |
        该目录包含全局公共 UI 组件。

        修改公共组件属于高回归风险。

        审核时必须：

        - 检查现有调用方兼容性
        - 检查默认参数行为变化
        - 检查尺寸、颜色、padding、点击区域变化
        - 检查是否改变无障碍语义
        - 检查 API 参数是否产生破坏性变化
        - 检查主题切换后是否正确重组

        如果修改 TopBarIcon 或 AppSearchField，
        必须特别关注 AGENT.md 中规定的固定行为是否被破坏。

    # ----------------------------------------------------------
    # Settings
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/settings/**/*.kt"
      instructions: |
        设置与持久化修改属于回归敏感区域。

        检查：

        - SharedPreferences key 是否兼容已有版本
        - 默认值是否改变
        - 是否可能清除已有用户设置
        - 写入后是否正确刷新状态
        - 是否存在类型迁移问题
        - 是否影响主题色、色调模式和引擎配置
        - 是否存在 Activity / Context 生命周期问题

        修改已有 key 的含义、类型或默认行为时，
        必须指出升级兼容性风险。

    # ----------------------------------------------------------
    # SAF / 文件 / 游戏扫描
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/*Scanner*.kt"
      instructions: |
        游戏扫描属于核心功能。

        严格检查：

        - SAF 权限失效
        - DocumentFile null
        - 文件不存在
        - 目录不可读
        - 非法目录结构
        - 大型目录性能
        - 重复游戏
        - 异常文件名
        - 大小写问题
        - 引擎误识别
        - 扫描异常是否导致整个流程中止
        - 新规则是否影响其它引擎识别

        修改识别条件时，必须特别分析回归风险。

    - path: "app/src/main/java/**/*Save*.kt"
      instructions: |
        存档和文件管理属于高风险代码。

        检查：

        - 是否可能覆盖用户游戏原文件
        - 是否可能错误删除文件
        - 源路径 / 目标路径是否正确
        - 是否处理文件不存在
        - 是否处理部分复制失败
        - IO 流是否释放
        - 是否存在路径穿越或错误目录问题
        - 失败后状态是否一致
        - 镜像存档是否仍符合项目“不破坏游戏文件”的设计原则

        任何可能造成用户数据丢失的问题按 Blocker 处理。

    # ----------------------------------------------------------
    # Engine launcher
    # ----------------------------------------------------------
    - path: "app/src/main/java/**/*EngineLauncher*.kt"
      instructions: |
        EngineLauncher 属于核心启动链路。

        修改时必须分析对全部受支持引擎的影响：

        - Kirikiri
        - krkrsdl3
        - ONScripter
        - Artemis
        - Tyrano

        检查：

        - 引擎匹配是否正确
        - SAF URI 到路径映射是否安全
        - Intent 参数是否完整
        - Activity 启动失败是否处理
        - 缺少运行库时是否安全失败
        - 单游戏配置是否正确应用
        - 默认配置是否产生行为变化

        即使 PR 只声称修复某一个引擎，
        也要检查共享路径是否影响其它引擎。

    # ----------------------------------------------------------
    # Engine / Native
    # ----------------------------------------------------------
    - path: "engine/**/*"
      instructions: |
        engine/ 是 Tyranor Next 核心运行时，
        必须采用最高严格度审核。

        不要只检查代码风格。
        重点关注实际运行安全与兼容性。

        必须考虑：

        - Kirikiri
        - krkrsdl3
        - ONScripter
        - Artemis
        - Tyrano
        - SDL2 / SDL3
        - JNI
        - Native Plugin
        - 动态库加载
        - 游戏路径
        - 存档路径
        - 字体与资源加载
        - 渲染
        - Activity 生命周期

        重点检查：

        - Native 崩溃风险
        - JNI 签名不匹配
        - Java/Kotlin 与 native 生命周期不同步
        - use-after-free
        - double free
        - 内存泄漏
        - 文件描述符泄漏
        - 指针 / 长度错误
        - buffer 越界
        - 错误线程调用
        - SDL 初始化 / 释放不对称
        - native library 加载顺序错误
        - ABI 假设
        - 路径编码问题
        - 异常情况下资源清理
        - 修改是否破坏其它游戏

        对 engine/ 的修改，
        “能够编译”绝不代表审核通过。

        如果缺少足够信息证明真实兼容性，
        应明确要求实际游戏运行或回归验证，
        但不得虚假声称 CodeRabbit 已执行真实设备测试。

    # ----------------------------------------------------------
    # JNI / C / C++
    # ----------------------------------------------------------
    - path: "**/*.cpp"
      instructions: |
        严格审核 native C++ 健壮性。

        重点关注：

        - 空指针
        - 越界访问
        - 生命周期
        - ownership
        - use-after-free
        - double free
        - 内存泄漏
        - 文件句柄泄漏
        - 未检查返回值
        - 未定义行为
        - integer overflow
        - signed / unsigned 转换
        - 字符串编码
        - JNI local/global reference 生命周期
        - Java exception 状态
        - 多线程安全

        潜在 native 崩溃或内存破坏应按 Blocker 或 Major 报告。

    - path: "**/*.c"
      instructions: |
        严格检查 C 代码中的内存安全、数组边界、资源生命周期、
        返回值处理、错误路径和线程安全。

    - path: "**/*.h"
      instructions: |
        检查接口变化是否破坏 ABI/API，
        是否影响其它 native 模块和调用方。

    # ----------------------------------------------------------
    # Gradle / Build
    # ----------------------------------------------------------
    - path: "**/*.gradle*"
      instructions: |
        检查构建系统修改是否：

        - 引入不必要依赖
        - 改变 minSdk / targetSdk / compileSdk
        - 改变 Kotlin / AGP / Gradle 兼容性
        - 破坏 arm64-v8a native 打包
        - 影响 assets/nativeplugins
        - 增加不可信仓库源
        - 引入动态版本
        - 泄露凭据
        - 导致 CI 与本地构建行为不同

        版本升级应关注 breaking changes，
        不应只因为 Gradle sync 成功就判断安全。

    # ----------------------------------------------------------
    # Manifest
    # ----------------------------------------------------------
    - path: "**/AndroidManifest.xml"
      instructions: |
        审核新增权限和组件暴露。

        检查：

        - 是否新增不必要权限
        - exported 是否正确
        - Intent Filter 是否扩大攻击面
        - FileProvider / provider 是否安全
        - Activity / Service 是否被意外暴露
        - 网络 / 存储权限是否符合实际用途

        新增敏感权限时必须要求 PR 中说明原因。

    # ----------------------------------------------------------
    # GitHub / CI
    # ----------------------------------------------------------
    - path: ".github/**/*"
      instructions: |
        检查 CI 和仓库治理配置。

        特别注意：

        - GitHub Actions 是否使用过大的 permissions
        - 是否可能泄露 secrets
        - pull_request_target 是否被不安全使用
        - 是否运行来自不可信 PR 的任意代码并同时暴露 secrets
        - 第三方 Action 是否可信
        - 是否破坏现有 PR 审核门禁
        - 是否绕过必要测试

    # ----------------------------------------------------------
    # AGENT / CONTRIBUTING 本身
    # ----------------------------------------------------------
    - path: "AGENT.md"
      instructions: |
        本文件是项目 AI 开发与审核的最高项目级技术规范之一。

        修改本文件时，检查：

        - 是否降低现有强制约束
        - 是否引入相互矛盾规则
        - 是否与当前项目实现明显不一致
        - 是否删除测试、健壮性或回归审核要求
        - 是否导致审核规则变得模糊

        不要使用旧版 AGENT.md 的规则审核新版 AGENT.md 本身；
        应重点判断规则变化的合理性以及对后续开发的影响。

    - path: "CONTRIBUTING.md"
      instructions: |
        本文件定义贡献流程和 PR 合并要求。

        修改时检查：

        - 是否与 AGENT.md 冲突
        - 是否降低质量门槛
        - 是否删除必要审核要求
        - 是否产生编号、措辞或流程歧义
        - 是否让“必须”要求变成无法执行的模糊建议

chat:
  # 允许在 PR 评论里继续向 CodeRabbit 追问。
  auto_reply: true