name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Beta version label, for example 1.0-beta.1. Defaults to beta-<run_number>."
        required: false
        type: string
  push:
    tags:
      - "beta-*"

permissions:
  contents: write

concurrency:
  group: android-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-beta:
    name: Release Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release metadata
        id: meta
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#beta-}"
          else
            version="${INPUT_VERSION_NAME:-beta-${GITHUB_RUN_NUMBER}}"
            tag="beta-${version}"
          fi

          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          APK_PATH: ${{ steps.meta.outputs.apk }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Tyranor Next ${VERSION_NAME}" \
              --notes "Automated beta build from ${GITHUB_SHA}." \
              --prerelease
          fi
